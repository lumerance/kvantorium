<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030806">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Кванториум-28">
<script>
// Тема выставляется здесь, до подключения CSS и отрисовки — иначе при
// светлой теме страница на долю секунды мелькала бы тёмной (FOUC).
// По умолчанию — тёмная (как и было всегда), пока не выбрана светлая явно.
(function () {
  try {
    if (localStorage.getItem('kvantorium28.theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', '#e4ede8');
    }
    // запущено как веб-приложение с экрана «Домой» — нижняя панель прижимается к краю
    if (navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) {
      document.documentElement.classList.add('standalone');
    }
    var a = JSON.parse(localStorage.getItem('kvantorium28.appearance') || '{}');
    var el = document.documentElement;
    if (a.accent && a.accent !== 'green') el.setAttribute('data-accent', a.accent);
    ['glass', 'glow', 'bglight', 'motion'].forEach(function (k) { if (a[k] === false) el.setAttribute('data-' + k, 'off'); });
  } catch (e) {}
})();
</script>
<title>Кванториум-28 · Инструмент педагога</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>

<div class="app" id="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="nav-backdrop" id="nav-backdrop" aria-hidden="true"></div>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main id="view" class="view"></main>
  </div>
</div>

<div id="toasts" class="toasts"></div>
<div id="modal-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
