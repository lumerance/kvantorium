<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#04070a">
<script>
// Тема выставляется здесь, до подключения CSS и отрисовки — иначе при
// светлой теме страница на долю секунды мелькала бы тёмной (FOUC).
// По умолчанию — тёмная (как и было всегда), пока не выбрана светлая явно.
(function () {
  try {
    if (localStorage.getItem('kvantorium28.theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', '#eef3f1');
    }
  } catch (e) {}
})();
</script>
<title>Кванториум-28 · Инструмент педагога</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>
<body>
<div class="bg-grid" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="assets/logo.svg" alt="Кванториум-28" width="46" height="46">
    <div class="brand-text">
      <strong>Кванториум-28</strong>
      <small>универсальный инструмент педагога</small>
    </div>
  </div>
  <nav class="nav" id="nav">
    <a class="nav-btn" href="#/dashboard" data-route="dashboard">Обзор</a>
    <div class="nav-item">
      <a class="nav-btn" href="#/journal" data-route="journal">Журнал</a>
      <div class="nav-dropdown">
        <div class="nav-dropdown-inner">
          <a href="#/journal?kind=actual">📝 Фактический</a>
          <a href="#/journal">📋 Официальный</a>
        </div>
      </div>
    </div>
    <a class="nav-btn" href="#/enroll"    data-route="enroll">Набор</a>
    <a class="nav-btn" href="#/hours"     data-route="hours">Часы</a>
    <a class="nav-btn" href="#/salary"    data-route="salary">Зарплата</a>
    <a class="nav-btn" href="#/data"      data-route="data">Данные</a>
  </nav>
  <button id="theme-toggle" class="btn sm ghost theme-toggle" type="button" aria-label="Переключить тему"></button>
</header>

<main id="view" class="view"></main>

<div id="toasts" class="toasts"></div>
<div id="modal-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
